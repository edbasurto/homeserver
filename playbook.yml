---
- name: Base docker setup
  hosts: docker-hosts
  become: yes

  pre_tasks:
    - name: update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
    
    - name: Ensure git is installed on Debian/Ubuntu hosts
      ansible.builtin.apt:
        name: git
        state: present
      when: ansible_pkg_mgr == "apt"

  roles:
    - initialize

- name: Install and configure Docker on Docker hosts
  hosts: docker-hosts
  become: yes

  roles:
    - geerlingguy.docker

- name: Sync Docker service configs
  hosts: docker-hosts
  become: yes

  roles:
    - container-configs

- name: Deploy Docker stacks/containers
  hosts: docker-hosts
  become: yes

  roles:
    - containers

- name: Configure NUT UPS monitoring (client)
  hosts: docker-hosts
  become: yes

  tags: [nut-client]
  roles:
    - nut-client

- name: Join hosts to the tailnet
  hosts: tailscale_hosts
  become: yes

  tags: [tailscale]
  roles:
    - tailscale

- name: Discord Site Monitor Bot (Kutone, systemd + venv, not Docker)
  hosts: kutone
  become: yes

  tags: [discord-monitor-bot]
  roles:
    - discord-monitor-bot

- name: Restic backups to Fenrir (Amaterasu -> Fenrir, the "2" in 3-2-1)
  hosts: amaterasu
  become: yes

  tags: [restic-backup]
  vars:
    fenrir_ip: 192.168.50.14
    fenrir_restic_path: backups
    fenrir_ssh_user: ookami
  roles:
    - restic-backup

