---
- name: Base docker setup
  hosts: docker-hosts
  become: yes

  pre_tasks:
    - name: update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
    
    - name: Ensure git is installed on Debian/Ubuntu hosts
      ansible.builtin.apt:
        name: git
        state: present
      when: ansible_pkg_mgr == "apt"

  roles:
    - initialize

- name: Install and configure Docker on Docker hosts
  hosts: docker-hosts
  become: yes

  roles:
    - geerlingguy.docker

- name: Sync Docker service configs
  hosts: docker-hosts
  become: yes

  roles:
    - container-configs

- name: Deploy Docker stacks/containers
  hosts: docker-hosts
  become: yes

  roles:
    - containers

- name: Configure NUT UPS monitoring (client)
  hosts: docker-hosts
  become: yes

  tags: [nut-client]
  roles:
    - nut-client

- name: Join hosts to the tailnet
  hosts: tailscale_hosts
  become: yes

  tags: [tailscale]
  roles:
    - tailscale

