# Homelab environment name — umbrella identity for the whole fleet.
# Orthogonal to hosts (wolf deities) and stacks (HANABIE songs).
# Used for: Semaphore project name, DNS zone (*.johto.lan), tag/label prefixes.
homelab_env: johto

username: ookami
# nrusername: nonroot
shell: /usr/bin/bash

# NUT (Network UPS Tools) — kutone runs the server, docker-hosts run upsmon clients.
# nut_server_host and nut_monitor_password (vault) still need to be set.
#
# Renamed from "cyberpower" to "ups" 2026-09-26 -- Synology DSM's UPS client
# hardcodes the device name it looks for to literally "ups" (and its user to
# monuser/secret, added separately to kutone's upsd.users), so Fenrir could
# be added as a NUT client for graceful shutdown. The name itself is just a
# label in ups.conf, not tied to the actual hardware/driver.
nut_ups_name: ups
nut_server_host: 192.168.50.12

packages:
  - vim
  - htop
  - curl
  - tmux
  - neofetch
  - speedtest-cli
  - openssh-server
  - git-all
  - net-tools
  - itop