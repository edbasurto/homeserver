name: osaki-ni-cloud

services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    labels:
      com.ookami.stack: "osaki-ni-cloud"
      com.ookami.service: "nextcloud"
      com.ookami.owner: "homelab"
      com.ookami.environment: "prod"
    depends_on:
      - nextcloud-postgres
      - nextcloud-redis
    env_file: .env.amaterasu
    volumes:
      - /docker/configs/nextcloud:/var/www/html/config
      # Bind-mounted to the 8TB drive (bulk file storage), not a Docker
      # volume on the boot disk -- matches the Jellyfin/*arr convention.
      - /mnt/jellyfin-media-8tb/nextcloud-data:/var/www/html/data
    networks:
      - default
      - proxy
    ports:
      - "8443:80" # no port had ever been published -- Nextcloud was
                   # completely unreachable until now

  nextcloud-postgres:
    image: postgres:15-alpine
    container_name: nextcloud-postgres
    restart: unless-stopped
    labels:
      com.ookami.stack: "osaki-ni-cloud"
      com.ookami.service: "nextcloud-postgres"
      com.ookami.owner: "homelab"
      com.ookami.environment: "prod"
    env_file: .env.amaterasu
    environment:
      POSTGRES_DB: nextcloud
    volumes:
      - nextcloud-postgres_data:/var/lib/postgresql/data
    networks:
      - default

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    labels:
      com.ookami.stack: "osaki-ni-cloud"
      com.ookami.service: "nextcloud-redis"
      com.ookami.owner: "homelab"
      com.ookami.environment: "prod"
    networks:
      - default

volumes:
  nextcloud-postgres_data:

networks:
  proxy:
    external: true
    name: tousou-gate_proxy
