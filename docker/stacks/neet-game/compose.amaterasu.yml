name: neet-game

services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    labels:
      com.ookami.stack: "neet-game"
      com.ookami.service: "minecraft"
      com.ookami.owner: "homelab"
      com.ookami.environment: "prod"
    env_file: .env.amaterasu
    environment:
      - EULA=TRUE
    volumes:
      - minecraft_data:/data
    ports:
      - "25565:25565"

  pelican-panel:
    image: ghcr.io/pelican/panel:latest
    container_name: pelican-panel
    restart: unless-stopped
    labels:
      com.ookami.stack: "neet-game"
      com.ookami.service: "pelican-panel"
      com.ookami.owner: "homelab"
      com.ookami.environment: "prod"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - XDG_DATA_HOME=/pelican-data
      # Plain HTTP on a non-standard port, matching how everything else in
      # this fleet is reached -- no LetsEncrypt cert needed for a LAN-only
      # panel, and port 80/443 are already Traefik's on this host anyway.
      - APP_URL=http://192.168.50.180:8100
      - ADMIN_EMAIL=ed@basurto.org
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - pelican-plugins:/var/www/html/plugins # persists installed plugins
                                                # across container recreation --
                                                # matches Pelican's own
                                                # reference compose-bind.yml
    ports:
      - "8100:8100" # Caddy binds internally to whatever port is embedded
                     # in APP_URL, not always 80 -- confirmed via netstat
                     # inside the container after the first deploy guessed
                     # wrong (mapped 8100:80, nothing was listening on 80)

volumes:
  minecraft_data:
  pelican-data:
  pelican-logs:
  pelican-plugins:
