; CouchDB config for Obsidian Self-hosted LiveSync (knowledge-is-blooming).
; Ansible-managed — do not edit the deployed copy by hand, edit this file.
;
; These 9 settings are the ones the plugin's setup guide calls for: auth
; enforcement on both the main and admin-facing endpoints, CORS opened up
; for Obsidian's app:// / capacitor:// origins (mobile/desktop clients),
; and raised request/document size limits (LiveSync's chunked sync can
; produce larger-than-default CouchDB requests).

[chttpd]
require_valid_user = true
enable_cors = true
max_http_request_size = 4294967296

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[couchdb]
max_document_size = 50000000

[cors]
credentials = true
origins = app://obsidian.md, capacitor://localhost, http://localhost
