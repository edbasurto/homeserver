---
# Runs the Discord Site Monitor Bot directly on Kutone via systemd + a venv —
# deliberately not Docker. Kutone is a Raspberry Pi 3B+ with ~900MB usable
# RAM whose whole reason for existing is staying minimal and rarely touched
# (it's the NUT server). Docker's own daemon overhead (dockerd + containerd,
# commonly 100-200MB+ baseline before the bot process itself even starts)
# isn't worth adding for a single lightweight bot. See DECISIONS.md.
#
# Also the reason this bot moved off Amaterasu in the first place: a site
# monitor that runs on the same host it's supposed to detect failures for is
# a broken design — if Amaterasu goes down, so does the thing that's meant
# to tell you.

- name: Install python3-venv and git
  apt:
    name:
      - python3-venv
      - python3-pip
      - git
    state: present

- name: Clone discord-site-monitor-bot repo
  ansible.builtin.git:
    repo: https://github.com/edbasurto/Discord-Site-Monitor-Bot.git
    dest: "/home/{{ username }}/discord-site-monitor-bot"
    version: master
  become: yes
  become_user: "{{ username }}"

- name: Create venv and install dependencies
  ansible.builtin.pip:
    requirements: "/home/{{ username }}/discord-site-monitor-bot/requirements.txt"
    virtualenv: "/home/{{ username }}/discord-site-monitor-bot/venv"
    virtualenv_command: python3 -m venv
  become: yes
  become_user: "{{ username }}"

- name: Write discord-site-monitor-bot .env from vault
  copy:
    dest: "/home/{{ username }}/discord-site-monitor-bot/.env"
    content: "{{ discord_monitor_bot_env }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
  notify: restart discord-monitor-bot

# Not a secret — the list of fleet hosts it pings. Ansible-managed here since
# it's plain config, unlike the .env (which stays vault-only, never in git).
- name: Write sites.json (fleet hosts to monitor)
  copy:
    dest: "/home/{{ username }}/discord-site-monitor-bot/src/sites.json"
    content: |
      {
      	"Amaterasu": "192.168.50.180",
      	"Holo": "192.168.50.65",
      	"Chibiterasu": "192.168.50.170",
      	"Sif": "192.168.50.125",
      	"Kutone": "192.168.50.12"
      }
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  notify: restart discord-monitor-bot

- name: Install discord-monitor-bot systemd unit
  template:
    src: discord-monitor-bot.service.j2
    dest: /etc/systemd/system/discord-monitor-bot.service
    owner: root
    group: root
    mode: "0644"
  notify: restart discord-monitor-bot

- name: Enable and start discord-monitor-bot
  systemd:
    name: discord-monitor-bot
    daemon_reload: yes
    enabled: yes
    state: started
