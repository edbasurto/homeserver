---

- name: Passwordless Sudo For "{{ item }}"
  lineinfile:
    dest: "/etc/sudoers"
    regexp: "^%wheel"
    line: "{{ item }} ALL=(ALL) NOPASSWD: ALL"
    validate: "/usr/sbin/visudo -cf %s"
  loop:
    - "{{ username }}"

# TODO: Revisit to pin versions to avoid breaking changes.
- name: Install System Updates
  apt:
    update_cache: yes
    upgrade: yes

- name: Install Essential Packages
  apt:
    name: "{{ packages }}"
    state: latest

- name: Suppress Login Message (hushlogin)
  file:
    path: "/home/{{ item }}/.hushlogin"
    mode: 0644
    owner: "{{ item }}"
    group: "{{ item }}"
    modification_time: preserve
    access_time: preserve
    state: touch
  loop:
    - "{{ username }}"
  ignore_errors: true

# Install requirements for community.docker.docker_compose collection
- name: Install pip (if not already installed)
  become: yes
  package:
    name: python3-pip
    state: present

- name: Install docker dependencies and configure repositories
  become: yes
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
      - python3
      - python3-pip
      - libffi-dev
      - python3-dev
      - gcc
      - libc6-dev
      - make
    state: present
    update_cache: yes

- name: Install Python libraries for Docker
  become: yes
  pip:
    name:
      - requests
      - docker
      - docker-compose
    state: present
    executable: pip3

