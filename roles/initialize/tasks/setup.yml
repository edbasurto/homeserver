---

- name: Passwordless Sudo For "{{ item }}"
  lineinfile:
    dest: "/etc/sudoers"
    regexp: "^%wheel"
    line: "{{ item }} ALL=(ALL) NOPASSWD: ALL"
    validate: "/usr/sbin/visudo -cf %s"
  loop:
    - "{{ username }}"

# TODO: Revisit to pin versions to avoid breaking changes.
- name: Install System Updates
  apt:
    update_cache: yes
    upgrade: yes

- name: Install Essential Packages
  apt:
    name: "{{ packages }}"
    state: latest
  when: ansible_hostname == 'ookami-server'

- name: Install PXE Netboot.xyz Essential Packages
  apt:
    name:
      - ansible
      - git
      - apache2
  when: ansible_hostname == 'pxe-server'

- name: Clone Netboot.xyz GitHub Repository
  git:
    repo: https://github.com/netbootxyz/netboot.xyz.git
    dest: /opt/netboot.xyz
    clone: yes
    update: yes
  when: ansible_hostname == 'pxe-server'

- name: Start PXE Netboot Service
  ansible.builtin.command: ansible-playbook /opt/netboot.xyz/site.yml
  when: ansible_hostname == 'pxe-server'

- name: Suppress Login Message (hushlogin)
  file:
    path: "/home/{{ item }}/.hushlogin"
    mode: 0644
    owner: "{{ item }}"
    group: "{{ item }}"
    modification_time: preserve
    access_time: preserve
    state: touch
  loop:
    - "{{ username }}"
  ignore_errors: true

# Install requirements for community.docker.docker_compose collection
- name: Install pip (if not already installed)
  become: yes
  package:
    name: python3-pip
    state: present

- name: Install ansible dependencies using pip
  become: yes
  pip:
    name: "{{ item }}"
  with_items:
    - ansible
    - docker-compose

- name: Install docker dependencies and configure repositories
  become: yes
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
      - python3
      - python3-pip
      - libffi-dev
      - python3-dev
      - gcc
      - libc6-dev
      - make
    state: present
    update_cache: yes

- name: Install Python libraries using pip
  become: yes
  pip:
    name:
      - requests
      - docker
      - docker-compose
    state: present
    executable: pip3  # Ensure pip for Python 3 is used

- name: Install Docker SDK for Python
  ansible.builtin.pip:
    name: 
      - "docker==6.1.3"
      - "docker-compose"

- name: Stop Apache2 service
  ansible.builtin.systemd:
    name: apache2
    state: stopped
    enabled: no
  become: yes  # Use become (sudo) to run the command as root
  when: ansible_hostname == 'ookami-server'

