---

# ==============================
# Amaterasu stacks
# tousou-gate starts first — it creates the tousou-gate_proxy network
# that all other stacks depend on.
# ==============================

- name: Start tousou-gate (creates proxy network)
  community.docker.docker_compose_v2:
    project_src: /docker/stacks/tousou-gate
    files:
      - compose.amaterasu.yml
    project_name: tousou-gate
    state: present
    remove_orphans: true
  when: inventory_hostname == "amaterasu"

- name: Start amaterasu stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.amaterasu.yml
    project_name: "{{ item }}"
    state: present
    remove_orphans: true
  loop:
    - sunrise-mqtt-soup
    - hyperdimension-library
    - osaki-ni-cloud
    - spicy-queen-ctrl
    - neet-game
    - warning-core
  when: inventory_hostname == "amaterasu"

# ==============================
# Holo stacks
# ==============================

- name: Start holo stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.holo.yml
    project_name: "{{ item }}"
    state: present
  loop:
    - devs-talk
    - warning-core
  when: inventory_hostname == "holo"

# ==============================
# Chibiterasu stacks
# ==============================

- name: Start chibiterasu stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.chibiterasu.yml
    project_name: "{{ item }}"
    state: present
  loop:
    - good-day-so-epic
    - warning-core
  when: inventory_hostname == "chibiterasu"

# ==============================
# Discord bots (amaterasu only)
# NOTE: .env files for these bots live on the host and are NOT managed by
# Ansible — back them up manually before wiping amaterasu.
# ==============================

- name: Start Discord Music Bot
  community.docker.docker_compose_v2:
    project_src: /home/{{ username }}/repo-kawade/discord-music-bot
  register: music_bot_output
  when: inventory_hostname == 'amaterasu'

- debug:
    var: music_bot_output
  when: inventory_hostname == 'amaterasu'

