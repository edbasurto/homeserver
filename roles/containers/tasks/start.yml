---

# ==============================
# Amaterasu stacks
# tousou-gate starts first — it creates the tousou-gate_proxy network
# that all other stacks depend on.
# ==============================

- name: Start tousou-gate (creates proxy network)
  community.docker.docker_compose_v2:
    project_src: /docker/stacks/tousou-gate
    files:
      - compose.amaterasu.yml
    project_name: tousou-gate
    state: present
    remove_orphans: true
  when: inventory_hostname == "amaterasu"

- name: Start amaterasu stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.amaterasu.yml
    project_name: "{{ item }}"
    state: present
    remove_orphans: true
  loop:
    - sunrise-mqtt-soup
    - hyperdimension-library
    - osaki-ni-cloud
    - spicy-queen-ctrl
    - neet-game
    - warning-core
  when: inventory_hostname == "amaterasu"

# ==============================
# Holo stacks
# ==============================

- name: Start holo stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.holo.yml
    project_name: "{{ item }}"
    state: present
  loop:
    - devs-talk
    - warning-core
  when: inventory_hostname == "holo"

# ==============================
# Chibiterasu stacks
# ==============================

# good-day-so-epic is intentionally an empty sandbox (see DECISIONS.md) — its
# compose file defines no services by design, so `docker compose up` has
# nothing to start and errors with "no service selected". Not Ansible-managed
# until Ed actually adds something to it; start it manually at that point.
- name: Start chibiterasu stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.chibiterasu.yml
    project_name: "{{ item }}"
    state: present
  loop:
    - warning-core
  when: inventory_hostname == "chibiterasu"

# ==============================
# Sif stacks
# ==============================

- name: Start sif stacks
  community.docker.docker_compose_v2:
    project_src: "/docker/stacks/{{ item }}"
    files:
      - compose.sif.yml
    project_name: "{{ item }}"
    state: present
  loop:
    - warning-core
  when: inventory_hostname == "sif"

# ==============================
# Discord Music Bot (amaterasu only)
# NOTE: .env file lives on the host and is NOT managed by Ansible — back it
# up manually before wiping amaterasu.
#
# The Discord Site Monitor Bot used to run here too, but moved to Kutone
# (see roles/discord-monitor-bot) — a monitor that dies along with the host
# it's supposed to detect failures for defeats the point. Kutone is also
# independent of Amaterasu's own failure modes and (as of 2026-09-19) on the
# UPS's battery-backed outlets.
# ==============================

- name: Start Discord Music Bot
  community.docker.docker_compose_v2:
    project_src: /home/{{ username }}/repo-kawade/discord-music-bot
  register: music_bot_output
  when: inventory_hostname == 'amaterasu'

- debug:
    var: music_bot_output
  when: inventory_hostname == 'amaterasu'
  when: inventory_hostname == 'amaterasu'
