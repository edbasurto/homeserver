---

- name: Create base Docker directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /docker
    - /docker/stacks

# Per-stack directories — compose files and env files land here
- name: Create stack directories on amaterasu
  ansible.builtin.file:
    path: "/docker/stacks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - tousou-gate
    - sunrise-mqtt-soup
    - hyperdimension-library
    - osaki-ni-cloud
    - spicy-queen-ctrl
    - neet-game
    - warning-core
  when: inventory_hostname == "amaterasu"

- name: Create stack directories on holo
  ansible.builtin.file:
    path: "/docker/stacks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - devs-talk
    - warning-core
  when: inventory_hostname == "holo"

- name: Create stack directories on chibiterasu
  ansible.builtin.file:
    path: "/docker/stacks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - good-day-so-epic
    - warning-core
  when: inventory_hostname == "chibiterasu"

- name: Create stack directories on sif
  ansible.builtin.file:
    path: "/docker/stacks/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - warning-core
  when: inventory_hostname == "sif"

# Media library mount points (bind-mounted into containers)
- name: Create media directories on amaterasu
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  loop:
    - /data
    - /data/media
    - /data/media/movies
    - /data/media/tv
    - /data/media/music
    - /data/media/books
  when: inventory_hostname == "amaterasu"
