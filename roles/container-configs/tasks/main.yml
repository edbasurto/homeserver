# ==============================
# Discord Music Bot .env file (Amaterasu only)
# Vault var required in host_vars/amaterasu/vault.yml: discord_music_bot_env
# (discord_monitor_bot_env now lives in host_vars/kutone/vault.yml — that
# bot moved off Amaterasu, see roles/discord-monitor-bot)
# ==============================

- name: Ensure discord-music-bot directory exists on amaterasu
  file:
    path: /home/{{ username }}/repo-kawade/discord-music-bot
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"
  when: inventory_hostname == "amaterasu"

- name: Write discord-music-bot .env from vault
  copy:
    dest: /home/{{ username }}/repo-kawade/discord-music-bot/.env
    content: "{{ discord_music_bot_env }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0600"
  when: inventory_hostname == "amaterasu"

# discord-site-monitor-bot moved to Kutone (systemd + venv, not Docker) —
# see roles/discord-monitor-bot. A monitor that runs on the host it's
# supposed to detect failures for is a broken design.

# ==============================
# Home Assistant config (Amaterasu only)
# ==============================

- name: Ensure Home Assistant config directory exists on Amaterasu
  file:
    path: /docker/configs/homeassistant
    state: directory
    owner: 1000
    group: 1000
    mode: "0750"
  when: inventory_hostname == "amaterasu"

- name: Sync Home Assistant (non-secret) config files from repo
  copy:
    src: "{{ playbook_dir }}/docker/configs/homeassistant/"
    dest: "/docker/configs/homeassistant/"
    owner: 1000
    group: 1000
    mode: "0644"
  when: inventory_hostname == "amaterasu"

- name: Write Home Assistant secrets.yaml from Ansible Vault
  copy:
    dest: /docker/configs/homeassistant/secrets.yaml
    content: "{{ homeassistant_secrets_yaml }}"
    owner: 1000
    group: 1000
    mode: "0600"
  when:
    - inventory_hostname == "amaterasu"
    - homeassistant_secrets_yaml is defined
    - homeassistant_secrets_yaml is not none
    - homeassistant_secrets_yaml | length > 0

